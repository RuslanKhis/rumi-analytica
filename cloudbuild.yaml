# cloudbuild.yaml (Unified Pipeline)

steps:
# --- BACKEND STEPS ---
  - name: 'gcr.io/cloud-builders/docker'
    id: 'Build Backend Image'
    dir: 'backend'
    args: ['build', '-t', 'us-central1-docker.pkg.dev/$PROJECT_ID/rumi-analytica/backend:latest', '.']

  - name: 'gcr.io/cloud-builders/docker'
    id: 'Push Backend Image'
    dir: 'backend'
    waitFor: ['Build Backend Image']
    args: ['push', 'us-central1-docker.pkg.dev/$PROJECT_ID/rumi-analytica/backend:latest']

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'Deploy Backend'
    dir: 'backend'
    waitFor: ['Push Backend Image']
    args:
      - 'run'
      - 'deploy'
      - 'rumi-analytica-backend'
      - '--image'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/rumi-analytica/backend:latest'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--service-account'
      - 'rumi-app-runner-sa@${PROJECT_ID}.iam.gserviceaccount.com'
      - '--set-env-vars'
      - 'SIMPLE_AUTH_USERNAME=${_SIMPLE_AUTH_USERNAME},FRONTEND_URL=${_FRONTEND_URL},GOOGLE_GENAI_USE_VERTEXAI=True,GOOGLE_CLOUD_PROJECT=${_GOOGLE_CLOUD_PROJECT},GOOGLE_CLOUD_LOCATION=${_GOOGLE_CLOUD_LOCATION}'
      - '--set-secrets'
      - 'SIMPLE_AUTH_PASSWORD_HASH=RUMI_PASSWORD_HASH:latest,JWT_SECRET_KEY=RUMI_JWT_SECRET:latest'

# --- FRONTEND STEPS ---
  - name: 'node:18'
    id: 'Frontend NPM Install'
    entrypoint: 'npm'
    dir: 'frontend'
    waitFor: ['Deploy Backend'] # Start frontend steps after backend is deployed
    args: ['ci']

  - name: 'node:18'
    id: 'Frontend Build'
    entrypoint: 'npm'
    dir: 'frontend'
    waitFor: ['Frontend NPM Install']
    env: ['VITE_BACKEND_URL=${_BACKEND_URL}']
    args: ['run', 'build']

  - name: 'gcr.io/cloud-builders/docker'
    id: 'Build Frontend Image'
    dir: 'frontend'
    waitFor: ['Frontend Build']
    args: ['build', '-t', 'us-central1-docker.pkg.dev/$PROJECT_ID/rumi-analytica/frontend:latest', '.']

  - name: 'gcr.io/cloud-builders/docker'
    id: 'Push Frontend Image'
    dir: 'frontend'
    waitFor: ['Build Frontend Image']
    args: ['push', 'us-central1-docker.pkg.dev/$PROJECT_ID/rumi-analytica/frontend:latest']

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'Deploy Frontend'
    dir: 'frontend'
    waitFor: ['Push Frontend Image']
    args:
      - 'run'
      - 'deploy'
      - 'rumi-analytica-frontend'
      - '--image'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/rumi-analytica/frontend:latest'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--service-account'
      - 'rumi-app-runner-sa@${PROJECT_ID}.iam.gserviceaccount.com'

# Substitutions are now defined in the trigger itself
substitutions:
  _BACKEND_URL: ''
  _FRONTEND_URL: ''
  _SIMPLE_AUTH_USERNAME: ''
  _GOOGLE_CLOUD_PROJECT: ''
  _GOOGLE_CLOUD_LOCATION: ''
options:
  logging: CLOUD_LOGGING_ONLY