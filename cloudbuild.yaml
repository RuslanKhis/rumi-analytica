# ./cloudbuild.yaml

steps:
# --- BACKEND STEPS ---
  - name: 'gcr.io/cloud-builders/docker'
    id: 'Build Backend Image'
    dir: 'backend'
    waitFor: ['-']
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        if [ "$_SERVICE" = "backend" ] || [ -z "$_SERVICE" ]; then
          echo "Building backend image..."
          docker build -t us-central1-docker.pkg.dev/$PROJECT_ID/rumi-analytica/backend:latest .
        else
          echo "Skipping backend build: _SERVICE='$_SERVICE'"
        fi

  - name: 'gcr.io/cloud-builders/docker'
    id: 'Push Backend Image'
    dir: 'backend'
    waitFor: ['Build Backend Image']
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        if [ "$_SERVICE" = "backend" ] || [ -z "$_SERVICE" ]; then
          echo "Pushing backend image..."
          docker push us-central1-docker.pkg.dev/$PROJECT_ID/rumi-analytica/backend:latest
        else
          echo "Skipping backend push: _SERVICE='$_SERVICE'"
        fi

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'Deploy Backend'
    dir: 'backend'
    waitFor: ['Push Backend Image']
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        if [ "$_SERVICE" = "backend" ] || [ -z "$_SERVICE" ]; then
          echo "Deploying backend..."
          gcloud run deploy rumi-analytica-backend \
            --image us-central1-docker.pkg.dev/$PROJECT_ID/rumi-analytica/backend:latest \
            --region us-central1 \
            --platform managed \
            --allow-unauthenticated \
            --set-env-vars "SIMPLE_AUTH_USERNAME=${_SIMPLE_AUTH_USERNAME},FRONTEND_URL=${_FRONTEND_URL},GOOGLE_GENAI_USE_VERTEXAI=True,GOOGLE_CLOUD_PROJECT=${_GOOGLE_CLOUD_PROJECT},GOOGLE_CLOUD_LOCATION=${_GOOGLE_CLOUD_LOCATION}" \
            --set-secrets "SIMPLE_AUTH_PASSWORD_HASH=RUMI_PASSWORD_HASH:latest,JWT_SECRET_KEY=RUMI_JWT_SECRET:latest"
        else
          echo "Skipping backend deploy: _SERVICE='$_SERVICE'"
        fi

# --- FRONTEND STEPS ---
  - name: 'node:18'
    id: 'Frontend NPM Install'
    entrypoint: 'bash'
    dir: 'frontend'
    waitFor: ['-']
    args:
      - '-c'
      - |
        if [ "$_SERVICE" = "frontend" ] || [ -z "$_SERVICE" ]; then
          echo "Installing frontend dependencies..."
          npm ci
        else
          echo "Skipping frontend npm install: _SERVICE='$_SERVICE'"
        fi

  - name: 'node:18'
    id: 'Frontend Build'
    entrypoint: 'bash'
    dir: 'frontend'
    waitFor: ['Frontend NPM Install']
    env: ['VITE_BACKEND_URL=${_BACKEND_URL}']
    args:
      - '-c'
      - |
        if [ "$_SERVICE" = "frontend" ] || [ -z "$_SERVICE" ]; then
          echo "Building frontend..."
          npm run build
        else
          echo "Skipping frontend build: _SERVICE='$_SERVICE'"
        fi

  - name: 'gcr.io/cloud-builders/docker'
    id: 'Build Frontend Image'
    dir: 'frontend'
    waitFor: ['Frontend Build']
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        if [ "$_SERVICE" = "frontend" ] || [ -z "$_SERVICE" ]; then
          echo "Building frontend image..."
          docker build -t us-central1-docker.pkg.dev/$PROJECT_ID/rumi-analytica/frontend:latest .
        else
          echo "Skipping frontend image build: _SERVICE='$_SERVICE'"
        fi

  - name: 'gcr.io/cloud-builders/docker'
    id: 'Push Frontend Image'
    dir: 'frontend'
    waitFor: ['Build Frontend Image']
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        if [ "$_SERVICE" = "frontend" ] || [ -z "$_SERVICE" ]; then
          echo "Pushing frontend image..."
          docker push us-central1-docker.pkg.dev/$PROJECT_ID/rumi-analytica/frontend:latest
        else
          echo "Skipping frontend image push: _SERVICE='$_SERVICE'"
        fi

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'Deploy Frontend'
    dir: 'frontend'
    waitFor: ['Push Frontend Image']
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        if [ "$_SERVICE" = "frontend" ] || [ -z "$_SERVICE" ]; then
          echo "Deploying frontend..."
          gcloud run deploy rumi-analytica-frontend \
            --image us-central1-docker.pkg.dev/$PROJECT_ID/rumi-analytica/frontend:latest \
            --region us-central1 \
            --platform managed \
            --allow-unauthenticated
        else
          echo "Skipping frontend deploy: _SERVICE='$_SERVICE'"
        fi

substitutions:
  _SERVICE: ''
  _BACKEND_URL: ''
  _FRONTEND_URL: ''
  _SIMPLE_AUTH_USERNAME: ''
  _GOOGLE_CLOUD_PROJECT: ''
  _GOOGLE_CLOUD_LOCATION: ''
options:
  logging: CLOUD_LOGGING_ONLY